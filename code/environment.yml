# Legacy training environment
# 历史模型训练环境，仅供复现参考
# 不代表当前Flask API服务的推荐部署环境
# 当前Dockerfile使用Python 3.10
# 实际依赖兼容性尚需验证
name: pytorch-CycleGAN-and-pix2pix
channels:
- peterjc123
- defaults
dependencies:
- python=3.5.5
- pytorch=0.4.1
- scipy
- pip:
  - dominate==2.3.1
  - git+https://github.com/pytorch/vision.git
  - Pillow==5.0.0
  - numpy==1.14.1
  - visdom==0.1.7
