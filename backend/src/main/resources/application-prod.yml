spring:
  # 数据源配置（生产环境 - 从环境变量读取）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/cixiu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:your-password}

  # Redis配置（生产环境 - 从环境变量读取）
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 10
          min-idle: 5

# MyBatis-Plus配置（生产环境不输出SQL日志）
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 阿里云OSS配置（生产环境 - 从环境变量读取）
aliyun:
  oss:
    # OSS服务地域节点
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    # AccessKey ID（生产环境密钥）
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:your-access-key}
    # AccessKey Secret（生产环境密钥）
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:your-secret}
    # Bucket名称（生产环境）
    bucket-name: ${ALIYUN_OSS_BUCKET:cixiu-prod}
    # 自定义域名（可选，如果配置了CDN加速域名）
    custom-domain: ${ALIYUN_OSS_CUSTOM_DOMAIN:}

# AI服务配置（生产环境 - 从环境变量读取）
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8001}

# SpringDoc配置（生产环境建议关闭API文档）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 日志配置（生产环境）
logging:
  level:
    root: WARN
    com.jinyue.cixiu: INFO
  file:
    name: logs/cixiu-prod.log
    max-size: 100MB
    max-history: 30
